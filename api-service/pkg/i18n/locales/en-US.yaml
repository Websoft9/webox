# Email templates
email:
  verification_template: |
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="UTF-8">
        <title>Websoft9 - Email Verification</title>
    </head>
    <body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
        <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
            <h2 style="color: #2c3e50;">Welcome to Websoft9</h2>
            <p>Thank you for registering your Websoft9 account!</p>
            <p>Please click the link below to verify your email address:</p>
            <div style="text-align: center; margin: 30px 0;">
                <a href="${VerifyURL}" style="background-color: #3498db; color: white; padding: 12px 30px; text-decoration: none; border-radius: 5px; display: inline-block;">Verify Email</a>
            </div>
            <p>Or copy and paste this link into your browser:</p>
            <p style="word-break: break-all; background-color: #f8f9fa; padding: 10px; border-radius: 3px;">${VerifyURL}</p>
            <p style="color: #7f8c8d; font-size: 14px;">This link will expire in 30 minutes.</p>
            <hr style="border: none; border-top: 1px solid #eee; margin: 30px 0;">
            <p style="color: #7f8c8d; font-size: 12px;">
                If you did not create a Websoft9 account, please ignore this email.<br>
                This email was sent automatically. Please do not reply.
            </p>
        </div>
    </body>
    </html>
  password_reset_template: |
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="UTF-8">
        <title>Websoft9 - Password Reset</title>
    </head>
    <body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
        <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
            <h2 style="color: #2c3e50;">Websoft9 Password Reset</h2>
            <p>Hello!</p>
            <p>We received a request to reset your password. Please click the link below to reset your password:</p>
            <div style="text-align: center; margin: 30px 0;">
                <a href="${ResetURL}" style="background-color: #e74c3c; color: white; padding: 12px 30px; text-decoration: none; border-radius: 5px; display: inline-block;">Reset Password</a>
            </div>
            <p>Or copy and paste this link into your browser:</p>
            <p style="word-break: break-all; background-color: #f8f9fa; padding: 10px; border-radius: 3px;">${ResetURL}</p>
            <p style="color: #7f8c8d; font-size: 14px;">This link will expire in 30 minutes.</p>
            <hr style="border: none; border-top: 1px solid #eee; margin: 30px 0;">
            <p style="color: #7f8c8d; font-size: 12px;">
                If you did not request a password reset, please ignore this email and your password will not be changed.<br>
                This email was sent automatically. Please do not reply.
            </p>
        </div>
    </body>
    </html>
  verification_subject: "Websoft9 - Email Verification"
  password_reset_subject: "Websoft9 - Password Reset"

