  request.UpdateEmailChannelRequest:
    properties:
      description:
        example: Updated email notification channel
        maxLength: 500
        type: string
      encoding:
        enum:
        - utf-8
        - gbk
        - gb2312
        example: utf-8
        type: string
      name:
        example: Updated Email Channel
        maxLength: 100
        minLength: 1
        type: string
      quiet_hours:
        example: 22:00-08:00
        maxLength: 100
        type: string
      rate_limit:
        example: 3
        maximum: 1000
        minimum: 0
        type: integer
      retry_count:
        example: 3
        maximum: 10
        minimum: 0
        type: integer
      sender_email:
        example: noreply@example.com
        type: string
      sender_name:
        example: System Notifications
        type: string
      smtp_host:
        example: smtp.gmail.com
        type: string
      smtp_password:
        example: your-password
        type: string
      smtp_port:
        example: 587
        maximum: 65535
        minimum: 1
        type: integer
      smtp_security:
        enum:
        - none
        - tls
        - ssl
        example: tls
        type: string
      smtp_timeout:
        example: 30
        maximum: 300
        minimum: 0
        type: integer
      smtp_username:
        example: user@example.com
        type: string
    type: object
  request.UpdateNotificationTemplateRequest:
    properties:
      content:
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
      subject:
        maxLength: 255
        minLength: 2
        type: string
    required:
    - content
    - subject
    type: object
  request.UpdatePermissionRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
      sort_order:
        type: integer
      status:
        enum:
        - -1
        - 0
        - 1
        type: integer
    type: object
  request.UpdateRoleRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
      permission_ids:
        items:
          type: integer
        type: array
      sort_order:
        type: integer
      status:
        enum:
        - -1
        - 0
        - 1
        type: integer
    type: object
  request.UpdateSystemConfigRequest:
    properties:
      category:
        type: string
      config_key:
        type: string
      config_type:
        enum:
        - STRING
        - BOOLEAN
        - INTEGER
        - JSON
        - FLOAT
        type: string
      config_value:
        type: string
      description:
        type: string
      sort_order:
        type: integer
    required:
    - category
    - config_key
    - config_type
    - config_value
    type: object
  request.UpdateWebhookChannelRequest:
    properties:
      description:
        example: Updated webhook notification channel
        maxLength: 500
        type: string
      encoding:
        enum:
        - utf-8
        - gbk
        - gb2312
        example: utf-8
        type: string
      headers:
        additionalProperties:
          type: string
        type: object
      method:
        enum:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        example: POST
        type: string
      name:
        example: Updated Webhook Channel
        maxLength: 100
        minLength: 1
        type: string
      quiet_hours:
        example: 22:00-08:00
        maxLength: 100
        type: string
      rate_limit:
        example: 3
        maximum: 1000
        minimum: 0
        type: integer
      retry_count:
        example: 3
        maximum: 10
        minimum: 0
        type: integer
      secret:
        example: your-webhook-secret
        maxLength: 100
        type: string
      timeout:
        example: 30
        maximum: 300
        minimum: 0
        type: integer
      url:
        example: https://api.example.com/webhook
        type: string
    type: object
  request.UserAuthRequest:
    properties:
      basic_auth:
        allOf:
        - $ref: '#/definitions/request.BasicAuthRequest'
        description: Basic authentication configuration
      email_auth:
        allOf:
        - $ref: '#/definitions/request.EmailAuthRequest'
        description: Email authentication configuration
      login_security:
        allOf:
        - $ref: '#/definitions/request.LoginSecurityRequest'
        description: Login security configuration
      oauth2:
        allOf:
        - $ref: '#/definitions/request.OAuth2LoginConfigRequest'
        description: OAuth2 configuration
      password_policy:
        allOf:
        - $ref: '#/definitions/request.PasswordPolicyRequest'
        description: Password policy configuration
      two_factor:
        allOf:
        - $ref: '#/definitions/request.TwoFactorRequest'
        description: Two-factor authentication configuration
    type: object
  request.UserCreateRequest:
    properties:
      avatar:
        description: Avatar URL (optional)
        example: https://example.com/avatar.jpg
        type: string
      email:
        description: Email address, must be unique
        example: john@example.com
        type: string
      gender:
        description: 'Gender: 1-male, 2-female, 0-unknown (optional)'
        example: 1
        maximum: 2
        minimum: 0
        type: integer
      language:
        description: Language, default zh-CN (optional)
        example: zh-CN
        maxLength: 10
        type: string
      nickname:
        description: User nickname (optional)
        example: John Doe
        maxLength: 64
        type: string
      password:
        description: Password, 8-32 characters, must contain uppercase
        example: password123
        type: string
      phone:
        description: Phone number (optional)
        example: "+1234567890"
        maxLength: 20
        type: string
      role_ids:
        description: Array of role IDs to assign (optional)
        example:
        - 1
        - 2
        items:
          type: integer
        type: array
      signature:
        description: Personal signature (optional)
        example: This is my signature
        maxLength: 255
        type: string
      status:
        description: 'Status: 0-disabled, 1-enabled (optional)'
        example: 1
        maximum: 1
        minimum: 0
        type: integer
      timezone:
        description: Timezone, default UTC (optional)
        example: Asia/Shanghai
        maxLength: 64
        type: string
      username:
        description: Username, 3-32 characters, letters, numbers, underscore
        example: johndoe
        maxLength: 64
        type: string
    required:
    - email
    - password
    - username
    type: object
  request.UserLoginRequest:
    properties:
      password:
        example: Websoft9
        type: string
      username:
        example: admin@websoft9.com
        type: string
    required:
    - password
    - username
    type: object
  request.UserPasswordUpdateRequest:
    properties:
      new_password:
        example: newpassword123
        type: string
    required:
    - new_password
    type: object
  request.UserProfileUpdateRequest:
    properties:
      avatar:
        example: https://example.com/avatar.jpg
        type: string
      gender:
        description: 0-unknown, 1-male, 2-female
        enum:
        - 0
        - 1
        - 2
        example: 1
        type: integer
      language:
        example: zh-CN
        type: string
