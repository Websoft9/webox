      id:
        type: integer
      last_used_at:
        type: string
      name:
        type: string
      scopes:
        items:
          type: string
        type: array
      token:
        description: only return complete token when creates
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  response.ActionStatItem:
    properties:
      action:
        example: READ
        type: string
      count:
        example: 800
        type: integer
    type: object
  response.AuditLogListResponse:
    properties:
      items:
        description: 审计日志列表
        items:
          $ref: '#/definitions/response.AuditLogResponse'
        type: array
      page:
        description: 当前页码
        type: integer
      page_size:
        description: 每页数量
        type: integer
      total:
        description: 总记录数
        type: integer
      total_pages:
        description: 总页数
        type: integer
    type: object
  response.AuditLogResponse:
    properties:
      action:
        example: CREATE
        type: string
      created_at:
        example: "2025-07-15T10:30:00Z"
        type: string
      description:
        example: 创建应用实例：我的博客
        type: string
      error_message:
        type: string
      id:
        example: 1
        type: integer
      ip_address:
        example: 192.168.1.100
        type: string
      module:
        example: APP
        type: string
      request_data: {}
      request_method:
        example: POST
        type: string
      request_url:
        example: /api/v1/applications
        type: string
      resource_id:
        example: 123
        type: integer
      resource_name:
        example: 我的博客
        type: string
      resource_type:
        example: APP_INSTANCE
        type: string
      response_status:
        example: 200
        type: integer
