        type: string
      owner_id:
        type: integer
      owner_name:
        type: string
      status:
        type: integer
      updated_at:
        type: string
    type: object
  response.NotificationChannelListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/response.NotificationChannelResponse'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
