        type: array
      ip_whitelist_enabled:
        type: boolean
      lockout_duration:
        type: integer
      login_time_restriction:
        type: boolean
      max_login_attempts:
        type: integer
    type: object
  response.OAuth2ProviderResponse:
    properties:
      auto_register:
        type: boolean
