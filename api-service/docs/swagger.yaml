basePath: /
definitions:
  common.APIResponse:
    properties:
      code:
        example: 200
        type: integer
      data: {}
      error:
        example: Error message
        type: string
      message:
        example: Success
        type: string
      success:
        example: true
        type: boolean
    type: object
  common.PaginationResponse:
    properties:
      items:
        description: data list
      page:
        description: current page number
        type: integer
      page_size:
        description: page size
        type: integer
      total:
        description: total record count
        type: integer
      total_pages:
        description: total pages
        type: integer
    type: object
  common.Response:
    properties:
      code:
        example: 200
        type: integer
      data: {}
      error:
        example: Error message
        type: string
      message:
        example: Success
        type: string
      success:
        example: true
        type: boolean
    type: object
  model.AlertRuleType:
    enum:
    - METRIC
    - LOG
    - EVENT
    type: string
    x-enum-varnames:
    - AlertRuleTypeMetric
    - AlertRuleTypeLog
    - AlertRuleTypeEvent
  model.CustomFields:
    additionalProperties: true
    type: object
  model.JSON:
    additionalProperties: true
    type: object
  model.SecretKeyType:
    enum:
    - SECRET_KEY
    - ACCOUNT
    - FILE
    type: string
    x-enum-varnames:
    - SecretKeyTypeSecretKey
    - SecretKeyTypeAccount
    - SecretKeyTypeFile
  model.TargetType:
    enum:
    - SERVER
    - APP_INSTANCE
    - WORKFLOW
    type: string
    x-enum-varnames:
    - TargetTypeServer
    - TargetTypeAppInstance
    - TargetTypeWorkflow
  request.APIAuthRequest:
    properties:
      oauth2:
        $ref: '#/definitions/request.OAuth2Request'
      token_auth:
        $ref: '#/definitions/request.TokenAuthRequest'
    type: object
  request.AlertAcknowledgeRequest:
    properties:
      note:
        type: string
    type: object
  request.AlertResolveRequest:
    properties:
      resolution_note:
        type: string
    type: object
  request.AlertRuleCreateRequest:
    properties:
      condition_expression:
        type: string
      is_enabled:
        type: boolean
      metric_name:
        type: string
      name:
        maxLength: 64
        type: string
      notification_channels:
        type: string
      rule_type:
        allOf:
        - $ref: '#/definitions/model.AlertRuleType'
        enum:
        - METRIC
        - LOG
        - EVENT
      target_id:
        type: integer
      target_type:
        allOf:
        - $ref: '#/definitions/model.TargetType'
        enum:
        - SERVER
        - APP_INSTANCE
        - WORKFLOW
    required:
    - condition_expression
    - name
    - rule_type
    - target_type
    type: object
  request.AlertRuleUpdateRequest:
    properties:
      condition_expression:
        type: string
      is_enabled:
        type: boolean
      name:
        maxLength: 64
        type: string
      notification_channels:
        type: string
    type: object
  request.BasicAuthRequest:
    properties:
      login_methods:
        items:
          type: string
        type: array
    type: object
  request.BatchUpdateSystemConfigsRequest:
    properties:
      configs:
        items:
          $ref: '#/definitions/request.UpdateSystemConfigRequest'
        type: array
    required:
    - configs
    type: object
  request.ConfirmTOTPRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  request.CreateEmailChannelRequest:
    properties:
      code:
        example: email-channel-001
        maxLength: 50
        minLength: 3
        type: string
      description:
        example: Email notification channel for alerts
        maxLength: 500
        type: string
      encoding:
        enum:
        - utf-8
        - gbk
        - gb2312
        example: utf-8
        type: string
      name:
        example: My Email Channel
        maxLength: 100
        minLength: 1
        type: string
      quiet_hours:
        example: 22:00-08:00
        maxLength: 100
        type: string
      rate_limit:
        example: 3
        maximum: 1000
        minimum: 0
        type: integer
      retry_count:
        example: 3
        maximum: 10
        minimum: 0
        type: integer
      sender_email:
        example: noreply@example.com
        type: string
      sender_name:
        example: System Notifications
        type: string
      smtp_host:
        example: smtp.gmail.com
        type: string
      smtp_password:
        example: your-password
        type: string
      smtp_port:
        example: 587
        maximum: 65535
        minimum: 1
        type: integer
      smtp_security:
        enum:
        - none
        - tls
        - ssl
        example: tls
        type: string
      smtp_timeout:
        example: 30
        maximum: 300
        minimum: 0
        type: integer
      smtp_username:
        example: user@example.com
        type: string
    required:
    - code
    - name
    - sender_email
    - sender_name
    - smtp_host
    - smtp_password
    - smtp_port
    - smtp_security
    - smtp_username
    type: object
  request.CreateNotificationTemplateRequest:
    properties:
      content:
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
      subject:
        maxLength: 255
        minLength: 2
        type: string
      template_type:
        enum:
        - EMAIL
        - WEBHOOK
        - INTERNAL
        type: string
    required:
    - content
    - name
    - subject
    - template_type
    type: object
  request.CreatePermissionRequest:
    properties:
      action:
        maxLength: 32
        minLength: 2
        type: string
      code:
        maxLength: 64
        minLength: 2
        type: string
      description:
        maxLength: 500
        type: string
      is_menu:
        type: boolean
      module:
        maxLength: 32
        minLength: 2
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
      parent_id:
        type: integer
      resource:
        maxLength: 64
        type: string
      scope:
        enum:
        - platform
        - project
        type: string
      sort_order:
        type: integer
    required:
    - action
    - code
    - module
    - name
    - scope
    type: object
  request.CreateRoleRequest:
    properties:
      code:
        maxLength: 32
        minLength: 2
        type: string
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
      permission_ids:
        items:
          type: integer
        type: array
      sort_order:
        type: integer
    required:
    - code
    - name
    type: object
  request.CreateWebhookChannelRequest:
    properties:
      code:
        example: webhook-channel-001
        maxLength: 50
        minLength: 3
        type: string
      description:
        example: Webhook notification channel for alerts
        maxLength: 500
        type: string
      encoding:
        enum:
        - utf-8
        - gbk
        - gb2312
        example: utf-8
        type: string
      headers:
        additionalProperties:
          type: string
        type: object
      method:
        enum:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        example: POST
        type: string
      name:
        example: My Webhook Channel
        maxLength: 100
        minLength: 1
        type: string
      quiet_hours:
        example: 22:00-08:00
        maxLength: 100
        type: string
      rate_limit:
        example: 3
        maximum: 1000
        minimum: 0
        type: integer
      retry_count:
        example: 3
        maximum: 10
        minimum: 0
        type: integer
      secret:
        example: your-webhook-secret
        maxLength: 100
        type: string
      timeout:
        example: 30
        maximum: 300
        minimum: 0
        type: integer
      url:
        example: https://api.example.com/webhook
        type: string
    required:
    - code
    - method
    - name
    - url
    type: object
  request.DisableTOTPRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  request.EmailAuthRequest:
    properties:
      enabled:
        type: boolean
      expires_in:
        type: integer
    type: object
  request.EmailMethodRequest:
    properties:
      code_length:
        type: integer
      enabled:
        type: boolean
      expires_in:
        type: integer
      rate_limit:
        type: integer
      template:
        type: string
    type: object
  request.EnableEmailTwoFactorRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  request.ForgotPasswordRequest:
    properties:
      username:
        example: john@example.com
        type: string
    required:
    - username
    type: object
  request.LoginSecurityRequest:
    properties:
      allowed_login_hours:
        type: string
      ip_whitelist:
        items:
          type: string
        type: array
      ip_whitelist_enabled:
        type: boolean
      lockout_duration:
        maximum: 86400
        minimum: 60
        type: integer
      login_time_restriction:
        type: boolean
      max_login_attempts:
        maximum: 20
        minimum: 1
        type: integer
    type: object
  request.NotificationSettingsRequest:
    properties:
      email_notifications:
        type: boolean
      marketing_emails:
        type: boolean
      push_notifications:
        type: boolean
      sms_notifications:
        type: boolean
    type: object
  request.OAuth2LoginConfigRequest:
    properties:
      auto_register:
        type: boolean
      default_role:
        type: string
      enabled:
        type: boolean
      providers:
        items:
          $ref: '#/definitions/request.OAuth2ProviderRequest'
        type: array
    type: object
  request.OAuth2LoginRequest:
    properties:
      code:
        example: authorization_code
        type: string
      provider:
        example: github
        type: string
      state:
        example: random_state
        type: string
    required:
    - code
    - provider
    - state
    type: object
  request.OAuth2ProviderRequest:
    properties:
      authorize_url:
        type: string
      auto_register:
        type: boolean
      client_id:
        type: string
      client_secret:
        type: string
      enabled:
        type: boolean
      name:
        type: string
      redirect_uri:
        type: string
      scopes:
        items:
          type: string
        type: array
      sort_order:
        type: integer
      token_url:
        type: string
      user_info_url:
        type: string
      user_mapping:
        additionalProperties:
          type: string
        type: object
    type: object
  request.OAuth2Request:
    properties:
      authorize_endpoint:
        type: string
      default_scopes:
        items:
          type: string
        type: array
      enabled:
        type: boolean
      token_endpoint:
        type: string
    type: object
  request.PasswordPolicyRequest:
    properties:
      max_length:
        maximum: 128
        minimum: 1
        type: integer
      min_length:
        maximum: 128
        minimum: 1
        type: integer
      password_expires_days:
        maximum: 365
        minimum: 0
        type: integer
      require_lowercase:
        type: boolean
      require_numbers:
        type: boolean
      require_symbols:
        type: boolean
      require_uppercase:
        type: boolean
    type: object
  request.ProfileChangePasswordRequest:
    properties:
      confirm_password:
        example: newpass123
        type: string
      new_password:
        example: newpass123
        minLength: 6
        type: string
      old_password:
        example: oldpass123
        type: string
    required:
    - confirm_password
    - new_password
    - old_password
    type: object
  request.ResendVerificationRequest:
    properties:
      username:
        example: john@example.com
        type: string
    required:
    - username
    type: object
  request.ResetPasswordRequest:
    properties:
      new_password:
        example: newpassword123
        type: string
      token:
        example: abc123def456
        type: string
    required:
    - new_password
    - token
    type: object
  request.RevokeAPITokenRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  request.RolePermissionRequest:
    properties:
      permission_ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - permission_ids
    type: object
  request.SecretKeyCreateRequest:
    properties:
      authorized_users:
        items:
          type: integer
        type: array
      custom_fields:
        additionalProperties: true
        type: object
      description:
        maxLength: 500
        type: string
      expires_at:
        type: string
      key_type:
        allOf:
        - $ref: '#/definitions/model.SecretKeyType'
        enum:
        - SECRET_KEY
        - ACCOUNT
        - FILE
      name:
        maxLength: 64
        minLength: 1
        type: string
      resource_code:
        maxLength: 64
        type: string
      resource_group_id:
        type: integer
    required:
    - key_type
    - name
    type: object
  request.SecretKeyUpdateRequest:
    properties:
      custom_fields:
        additionalProperties: true
        type: object
      key_type:
        allOf:
        - $ref: '#/definitions/model.SecretKeyType'
        enum:
        - SECRET_KEY
        - ACCOUNT
        - FILE
    required:
    - key_type
    type: object
  request.SecuritySettingsRequest:
    properties:
      login_alerts:
        type: boolean
      session_timeout:
        minimum: 0
        type: integer
    type: object
  request.SessionConfigRequest:
    properties:
      max_concurrent_sessions:
        type: integer
      remember_me_duration:
        type: integer
      remember_me_enabled:
        type: boolean
      timeout:
        type: integer
    type: object
  request.SwitchLanguageRequest:
    properties:
      language:
        maxLength: 10
        minLength: 2
        type: string
    required:
    - language
    type: object
  request.TOTPMethodRequest:
    properties:
      algorithm:
        type: string
      backup_codes_count:
        type: integer
      digits:
        type: integer
      enabled:
        type: boolean
      issuer:
        type: string
      period:
        type: integer
    type: object
  request.TagAssignRequest:
    properties:
      replaceAll:
        example: false
        type: boolean
      resourceCode:
        example: SERVER_001
        type: string
      tagIds:
        items:
          type: integer
        type: array
      tagNames:
        items:
          type: string
        type: array
    required:
    - resourceCode
    type: object
  request.TagCreateRequest:
    properties:
      color:
        example: '#ff0000'
        maxLength: 16
        type: string
      description:
        example: Production environment tag
        maxLength: 500
        type: string
      name:
        example: production
        maxLength: 128
        type: string
    required:
    - name
    type: object
  request.TagUnassignRequest:
    properties:
      resourceCode:
        example: SERVER_001
        type: string
      tagIds:
        items:
          type: integer
        type: array
    required:
    - resourceCode
    - tagIds
    type: object
  request.TagUpdateRequest:
    properties:
      color:
        example: '#ff0000'
        maxLength: 16
        type: string
      description:
        example: Production environment tag
        maxLength: 500
        type: string
      name:
        example: production
        maxLength: 128
        type: string
    required:
    - name
    type: object
  request.TestEmailChannelRequest:
    properties:
      code:
        type: string
      content:
        type: string
      recipient:
        type: string
      subject:
        type: string
    required:
    - code
    - recipient
    type: object
  request.TestNotificationTemplateRequest:
    properties:
      code:
        type: string
      recipient:
        type: string
      variable_data:
        additionalProperties: true
        type: object
    required:
    - code
    - recipient
    type: object
  request.TestSMTPRequest:
    properties:
      test_email:
        type: string
    required:
    - test_email
    type: object
  request.TestWebhookChannelRequest:
    properties:
      code:
        type: string
      payload: {}
    required:
    - code
    type: object
  request.TokenAuthRequest:
    properties:
      algorithm:
        type: string
      auto_refresh:
        type: boolean
      expires_in:
        type: integer
      refresh_expires_in:
        type: integer
      secret:
        type: string
    type: object
  request.TwoFactorMethodsRequest:
    properties:
      email:
        $ref: '#/definitions/request.EmailMethodRequest'
      totp:
        $ref: '#/definitions/request.TOTPMethodRequest'
    type: object
  request.TwoFactorRequest:
    properties:
      enabled:
        type: boolean
      methods:
        $ref: '#/definitions/request.TwoFactorMethodsRequest'
      required_roles:
        items:
          type: string
        type: array
    type: object
  request.UpdateAuthConfigRequest:
    properties:
      api_auth:
