      created_at:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      name:
        type: string
      provider:
        type: string
      redirect_uri:
        type: string
      scopes:
        items:
          type: string
        type: array
      updated_at:
        type: string
      user_mapping:
        additionalProperties:
          type: string
        type: object
    type: object
  response.PasswordPolicyResponse:
    properties:
      max_length:
