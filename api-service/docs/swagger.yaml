        type: integer
      password_expires_days:
        type: integer
      password_history:
        type: integer
      require_lowercase:
        type: boolean
      require_numbers:
        type: boolean
      require_symbols:
        type: boolean
      require_uppercase:
        type: boolean
    type: object
  response.PermissionListResponse:
