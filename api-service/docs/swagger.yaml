basePath: /
definitions:
  model.JSONChannelConfig:
    additionalProperties: true
    type: object
  request.APIAuthRequest:
    properties:
      oauth2:
        $ref: '#/definitions/request.OAuth2Request'
      token_auth:
        $ref: '#/definitions/request.TokenAuthRequest'
    type: object
  request.BasicAuthRequest:
    properties:
      login_methods:
        items:
          type: string
        type: array
    type: object
  request.BatchUpdateSystemConfigsRequest:
    properties:
      configs:
        items:
          $ref: '#/definitions/request.UpdateSystemConfigRequest'
        type: array
    required:
    - configs
    type: object
  request.ConfirmTOTPRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  request.CreateEmailChannelRequest:
    properties:
      code:
        example: email-channel-001
        maxLength: 50
        minLength: 3
        type: string
      description:
        example: Email notification channel for alerts
        maxLength: 500
        type: string
      encoding:
        enum:
        - utf-8
        - gbk
        - gb2312
        example: utf-8
        type: string
      name:
        example: My Email Channel
        maxLength: 100
        minLength: 1
        type: string
      quiet_hours:
        example: 22:00-08:00
        maxLength: 100
        type: string
      rate_limit:
        example: 3
        maximum: 1000
        minimum: 0
        type: integer
      retry_count:
        example: 3
        maximum: 10
        minimum: 0
        type: integer
      sender_email:
        example: noreply@example.com
        type: string
      sender_name:
        example: System Notifications
        type: string
      smtp_host:
        example: smtp.gmail.com
        type: string
      smtp_password:
        example: your-password
        type: string
      smtp_port:
        example: 587
        maximum: 65535
        minimum: 1
        type: integer
      smtp_security:
        enum:
        - none
        - tls
        - ssl
        example: tls
        type: string
      smtp_timeout:
        example: 30
        maximum: 300
        minimum: 0
        type: integer
      smtp_username:
        example: user@example.com
        type: string
    required:
    - code
    - name
    - sender_email
    - sender_name
    - smtp_host
    - smtp_password
    - smtp_port
    - smtp_security
    - smtp_username
    type: object
  request.CreatePermissionRequest:
    properties:
      action:
        maxLength: 32
        minLength: 2
        type: string
      code:
        maxLength: 64
        minLength: 2
        type: string
      description:
        maxLength: 500
        type: string
      is_menu:
        type: boolean
      module:
        maxLength: 32
        minLength: 2
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
      parent_id:
        type: integer
      resource:
        maxLength: 64
        type: string
      scope:
        enum:
        - platform
        - project
        type: string
      sort_order:
        type: integer
    required:
    - action
    - code
    - module
    - name
    - scope
    type: object
  request.CreateRoleRequest:
    properties:
      code:
        maxLength: 32
        minLength: 2
        type: string
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
      permission_ids:
        items:
          type: integer
        type: array
      sort_order:
        type: integer
    required:
    - code
    - name
    type: object
  request.CreateWebhookChannelRequest:
    properties:
      code:
        example: webhook-channel-001
        maxLength: 50
        minLength: 3
        type: string
      description:
        example: Webhook notification channel for alerts
        maxLength: 500
        type: string
      encoding:
        enum:
        - utf-8
        - gbk
        - gb2312
        example: utf-8
        type: string
      headers:
        additionalProperties:
          type: string
        example:
          '"Authorization"': '"Bearer token"}'
          '{"Content-Type"': '"application/json"'
        type: object
      method:
        enum:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        example: POST
        type: string
      name:
        example: My Webhook Channel
        maxLength: 100
        minLength: 1
        type: string
      quiet_hours:
        example: 22:00-08:00
        maxLength: 100
        type: string
      rate_limit:
        example: 3
        maximum: 1000
        minimum: 0
        type: integer
      retry_count:
        example: 3
        maximum: 10
        minimum: 0
        type: integer
      secret:
        example: your-webhook-secret
        maxLength: 100
        type: string
      timeout:
        example: 30
        maximum: 300
        minimum: 0
        type: integer
      url:
        example: https://api.example.com/webhook
        type: string
    required:
    - code
    - method
    - name
    - url
    type: object
  request.DisableTOTPRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  request.EmailAuthRequest:
    properties:
      enabled:
        type: boolean
      expires_in:
        type: integer
    type: object
  request.EmailMethodRequest:
    properties:
      code_length:
        type: integer
      enabled:
        type: boolean
      expires_in:
        type: integer
      rate_limit:
        type: integer
      template:
        type: string
    type: object
  request.EnableEmailTwoFactorRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  request.ForgotPasswordRequest:
    properties:
      username:
        example: john@example.com
        type: string
    required:
    - username
    type: object
  request.LoginSecurityRequest:
    properties:
      allowed_login_hours:
        type: string
      ip_whitelist:
        items:
          type: string
        type: array
      ip_whitelist_enabled:
        type: boolean
      lockout_duration:
        maximum: 86400
        minimum: 60
        type: integer
      login_time_restriction:
        type: boolean
      max_login_attempts:
        maximum: 20
        minimum: 1
        type: integer
    type: object
  request.NotificationSettingsRequest:
    properties:
      email_notifications:
        type: boolean
      marketing_emails:
        type: boolean
      push_notifications:
        type: boolean
      sms_notifications:
        type: boolean
    type: object
  request.OAuth2LoginConfigRequest:
    properties:
      auto_register:
        type: boolean
      default_role:
        type: string
      enabled:
        type: boolean
      providers:
        items:
          $ref: '#/definitions/request.OAuth2ProviderRequest'
        type: array
    type: object
  request.OAuth2LoginRequest:
    properties:
      code:
        example: authorization_code
        type: string
      provider:
        example: github
        type: string
      state:
        example: random_state
        type: string
    required:
    - code
    - provider
    - state
    type: object
  request.OAuth2ProviderRequest:
    properties:
      authorize_url:
        type: string
      auto_register:
        type: boolean
      client_id:
        type: string
      client_secret:
        type: string
      enabled:
        type: boolean
      name:
        type: string
      redirect_uri:
        type: string
      scopes:
        items:
          type: string
        type: array
      sort_order:
        type: integer
      token_url:
        type: string
      user_info_url:
        type: string
      user_mapping:
        additionalProperties:
          type: string
        type: object
    type: object
  request.OAuth2Request:
    properties:
      authorize_endpoint:
        type: string
      default_scopes:
        items:
          type: string
        type: array
      enabled:
        type: boolean
      token_endpoint:
        type: string
    type: object
  request.PasswordPolicyRequest:
    properties:
      max_length:
        maximum: 128
        minimum: 1
        type: integer
      min_length:
        maximum: 128
        minimum: 1
        type: integer
      password_expires_days:
        maximum: 365
        minimum: 0
        type: integer
      require_lowercase:
        type: boolean
      require_numbers:
        type: boolean
      require_symbols:
        type: boolean
      require_uppercase:
        type: boolean
    type: object
  request.ProfileChangePasswordRequest:
    properties:
      confirm_password:
        example: newpass123
        type: string
      new_password:
        example: newpass123
        minLength: 6
        type: string
      old_password:
        example: oldpass123
        type: string
    required:
    - confirm_password
    - new_password
    - old_password
    type: object
  request.ResendVerificationRequest:
    properties:
      username:
        example: john@example.com
        type: string
    required:
    - username
    type: object
  request.ResetPasswordRequest:
    properties:
      new_password:
        example: newpassword123
        type: string
      token:
        example: abc123def456
        type: string
    required:
    - new_password
    - token
    type: object
  request.RevokeAPITokenRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  request.RolePermissionRequest:
    properties:
      permission_ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - permission_ids
    type: object
  request.SecuritySettingsRequest:
    properties:
      login_alerts:
        type: boolean
      session_timeout:
        minimum: 0
        type: integer
    type: object
  request.SessionConfigRequest:
    properties:
      max_concurrent_sessions:
        type: integer
      remember_me_duration:
        type: integer
      remember_me_enabled:
        type: boolean
      timeout:
        type: integer
    type: object
  request.TOTPMethodRequest:
    properties:
      algorithm:
        type: string
      backup_codes_count:
        type: integer
      digits:
        type: integer
      enabled:
        type: boolean
      issuer:
        type: string
      period:
        type: integer
    type: object
  request.TestEmailChannelRequest:
    properties:
      code:
        type: string
      content:
        type: string
      recipient:
        type: string
      subject:
        type: string
    required:
    - code
    - recipient
    type: object
  request.TestSMTPRequest:
    properties:
      test_email:
        type: string
    required:
    - test_email
    type: object
  request.TestWebhookChannelRequest:
    properties:
      code:
        type: string
      payload: {}
    required:
    - code
    type: object
  request.TokenAuthRequest:
    properties:
      algorithm:
        type: string
      auto_refresh:
        type: boolean
      expires_in:
        type: integer
      refresh_expires_in:
        type: integer
      secret:
        type: string
    type: object
  request.TwoFactorMethodsRequest:
    properties:
      email:
        $ref: '#/definitions/request.EmailMethodRequest'
      totp:
        $ref: '#/definitions/request.TOTPMethodRequest'
    type: object
  request.TwoFactorRequest:
    properties:
      enabled:
        type: boolean
      methods:
        $ref: '#/definitions/request.TwoFactorMethodsRequest'
      required_roles:
        items:
          type: string
        type: array
    type: object
  request.UpdateAuthConfigRequest:
    properties:
      api_auth:
        $ref: '#/definitions/request.APIAuthRequest'
      session_config:
        $ref: '#/definitions/request.SessionConfigRequest'
      user_auth:
        $ref: '#/definitions/request.UserAuthRequest'
    type: object
  request.UpdateEmailChannelRequest:
    properties:
      description:
        example: Updated email notification channel
        maxLength: 500
        type: string
      encoding:
        enum:
        - utf-8
        - gbk
        - gb2312
        example: utf-8
        type: string
      name:
        example: Updated Email Channel
        maxLength: 100
        minLength: 1
        type: string
      quiet_hours:
        example: 22:00-08:00
        maxLength: 100
        type: string
      rate_limit:
        example: 3
        maximum: 1000
        minimum: 0
        type: integer
      retry_count:
        example: 3
        maximum: 10
        minimum: 0
        type: integer
      sender_email:
        example: noreply@example.com
        type: string
      sender_name:
        example: System Notifications
        type: string
      smtp_host:
        example: smtp.gmail.com
        type: string
      smtp_password:
        example: your-password
        type: string
      smtp_port:
        example: 587
        maximum: 65535
        minimum: 1
        type: integer
      smtp_security:
        enum:
        - none
        - tls
        - ssl
        example: tls
        type: string
      smtp_timeout:
        example: 30
        maximum: 300
        minimum: 0
        type: integer
      smtp_username:
        example: user@example.com
        type: string
    type: object
  request.UpdatePermissionRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
      sort_order:
        type: integer
      status:
        enum:
        - -1
        - 0
        - 1
        type: integer
    type: object
  request.UpdateRoleRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
      permission_ids:
        items:
          type: integer
        type: array
      sort_order:
        type: integer
      status:
        enum:
        - -1
        - 0
        - 1
        type: integer
    type: object
  request.UpdateSystemConfigRequest:
    properties:
      category:
        type: string
      config_key:
        type: string
      config_type:
        enum:
        - STRING
        - BOOLEAN
        - NUMBER
        - JSON
        type: string
      config_value:
        type: string
      description:
        type: string
      sort_order:
        type: integer
    required:
    - category
    - config_key
    - config_type
    - config_value
    type: object
  request.UpdateWebhookChannelRequest:
    properties:
      description:
        example: Updated webhook notification channel
        maxLength: 500
        type: string
      encoding:
        enum:
        - utf-8
        - gbk
        - gb2312
        example: utf-8
        type: string
      headers:
        additionalProperties:
          type: string
        example:
          '"Authorization"': '"Bearer token"}'
          '{"Content-Type"': '"application/json"'
        type: object
      method:
        enum:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        example: POST
        type: string
      name:
        example: Updated Webhook Channel
        maxLength: 100
        minLength: 1
        type: string
      quiet_hours:
        example: 22:00-08:00
        maxLength: 100
        type: string
      rate_limit:
        example: 3
        maximum: 1000
        minimum: 0
        type: integer
      retry_count:
        example: 3
        maximum: 10
        minimum: 0
        type: integer
      secret:
        example: your-webhook-secret
        maxLength: 100
        type: string
      timeout:
        example: 30
        maximum: 300
        minimum: 0
        type: integer
      url:
        example: https://api.example.com/webhook
        type: string
    type: object
  request.UserAuthRequest:
    properties:
      basic_auth:
        allOf:
        - $ref: '#/definitions/request.BasicAuthRequest'
        description: Basic authentication configuration
      email_auth:
        allOf:
        - $ref: '#/definitions/request.EmailAuthRequest'
        description: Email authentication configuration
      login_security:
        allOf:
        - $ref: '#/definitions/request.LoginSecurityRequest'
        description: Login security configuration
      oauth2:
        allOf:
        - $ref: '#/definitions/request.OAuth2LoginConfigRequest'
        description: OAuth2 configuration
      password_policy:
        allOf:
        - $ref: '#/definitions/request.PasswordPolicyRequest'
        description: Password policy configuration
      two_factor:
        allOf:
        - $ref: '#/definitions/request.TwoFactorRequest'
        description: Two-factor authentication configuration
    type: object
  request.UserCreateRequest:
    type: object
  request.UserLoginRequest:
    properties:
      password:
        example: Websoft9
        type: string
      username:
        example: admin@websoft9.com
        type: string
    required:
    - password
    - username
    type: object
  request.UserPasswordUpdateRequest:
    properties:
      new_password:
        example: newpassword123
        type: string
    required:
    - new_password
    type: object
  request.UserProfileUpdateRequest:
    properties:
      avatar:
        example: https://example.com/avatar.jpg
        type: string
      gender:
        description: 0-unknown, 1-male, 2-female
        enum:
        - 0
        - 1
        - 2
        example: 1
        type: integer
      language:
        example: zh-CN
        type: string
      nickname:
        example: John Doe
        type: string
      phone:
        example: "+1234567890"
        type: string
      signature:
        example: This is my signature
        type: string
      timezone:
        example: Asia/Shanghai
        type: string
    type: object
  request.UserRegisterRequest:
    properties:
      password:
        example: "123456"
        type: string
      username:
        example: john@example.com
        type: string
    required:
    - password
    - username
    type: object
  request.UserUpdateRequest:
    type: object
  request.UserUpdateStatusRequest:
    properties:
      status:
        example: 1
        maximum: 1
        minimum: 0
        type: integer
    required:
    - status
    type: object
  request.VerifyTwoFactorRequest:
    properties:
      code:
        type: string
      method:
        enum:
        - totp
        - email
        - backup
        type: string
      user_id:
        type: integer
    required:
    - code
    - method
    - user_id
    type: object
  response.APIAuthResponse:
    properties:
      oauth2:
        $ref: '#/definitions/response.OAuth2Response'
      token_auth:
        $ref: '#/definitions/response.TokenAuthResponse'
    type: object
  response.APIResponse:
    properties:
      code:
        example: 200
        type: integer
      data: {}
      error:
        example: Error message
