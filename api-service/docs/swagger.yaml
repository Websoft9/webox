basePath: /
definitions:
  common.APIResponse:
    properties:
      code:
        example: 200
        type: integer
      data: {}
      error:
        example: Error message
        type: string
      message:
        example: Success
        type: string
      success:
        example: true
        type: boolean
    type: object
  common.PaginationResponse:
    properties:
      items:
        description: 数据列表
      page:
        description: 当前页码
        type: integer
      page_size:
        description: 每页数量
        type: integer
      total:
        description: 总记录数
        type: integer
      total_pages:
        description: 总页数
        type: integer
    type: object
  common.Response:
    properties:
      code:
        example: 200
        type: integer
      data: {}
      error:
        example: Error message
        type: string
      message:
        example: Success
        type: string
      success:
        example: true
        type: boolean
    type: object
  model.AlertRuleType:
    enum:
    - METRIC
    - LOG
    - EVENT
    type: string
    x-enum-varnames:
    - AlertRuleTypeMetric
    - AlertRuleTypeLog
    - AlertRuleTypeEvent
  model.CustomFields:
    additionalProperties: true
    type: object
  model.SecretKeyType:
    enum:
    - API_KEY
    - DATABASE
    - SSH
    - CERTIFICATE
    - CUSTOM
    type: string
    x-enum-varnames:
    - SecretKeyTypeAPIKey
    - SecretKeyTypeDatabase
    - SecretKeyTypeSSH
    - SecretKeyTypeCertificate
    - SecretKeyTypeCustom
  model.TargetType:
    enum:
    - SERVER
    - APP_INSTANCE
    - WORKFLOW
    type: string
    x-enum-varnames:
    - TargetTypeServer
    - TargetTypeAppInstance
    - TargetTypeWorkflow
  request.APIAuthRequest:
    properties:
      oauth2:
        $ref: '#/definitions/request.OAuth2Request'
      token_auth:
        $ref: '#/definitions/request.TokenAuthRequest'
    type: object
  request.AlertAcknowledgeRequest:
    properties:
      note:
        type: string
    type: object
  request.AlertResolveRequest:
    properties:
      resolution_note:
        type: string
    type: object
  request.AlertRuleCreateRequest:
    properties:
      condition_expression:
        type: string
      is_enabled:
        type: boolean
      metric_name:
        type: string
      name:
        maxLength: 64
        type: string
      notification_channels:
        type: string
      rule_type:
        allOf:
        - $ref: '#/definitions/model.AlertRuleType'
        enum:
        - METRIC
        - LOG
        - EVENT
      target_id:
        type: integer
      target_type:
        allOf:
        - $ref: '#/definitions/model.TargetType'
        enum:
        - SERVER
        - APP_INSTANCE
        - WORKFLOW
    required:
    - condition_expression
    - name
    - rule_type
    - target_type
    type: object
  request.AlertRuleUpdateRequest:
    properties:
      condition_expression:
        type: string
      is_enabled:
        type: boolean
      name:
        maxLength: 64
        type: string
      notification_channels:
        type: string
    type: object
  request.BasicAuthRequest:
    properties:
      login_methods:
        items:
          type: string
        type: array
    type: object
  request.BatchUpdateSystemConfigsRequest:
    properties:
      configs:
        items:
          $ref: '#/definitions/request.UpdateSystemConfigRequest'
        type: array
    required:
    - configs
    type: object
  request.ConfirmTOTPRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  request.CreatePermissionRequest:
    properties:
      action:
        maxLength: 32
        minLength: 2
        type: string
      code:
        maxLength: 64
        minLength: 2
        type: string
      description:
        maxLength: 500
        type: string
      is_menu:
        type: boolean
      module:
        maxLength: 32
        minLength: 2
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
      parent_id:
        type: integer
      resource:
        maxLength: 64
        type: string
      scope:
        enum:
        - platform
        - project
        type: string
      sort_order:
        type: integer
    required:
    - action
    - code
    - module
    - name
    - scope
    type: object
  request.CreateRoleRequest:
    properties:
      code:
        maxLength: 32
        minLength: 2
        type: string
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
      permission_ids:
        items:
          type: integer
        type: array
      sort_order:
        type: integer
    required:
    - code
    - name
    type: object
  request.CreateServerRequest:
    properties:
      description:
        type: string
      host:
        maxLength: 255
        type: string
      hostname:
        maxLength: 255
        type: string
      internal_ip:
        type: string
      ipv6_address:
        type: string
      name:
        maxLength: 64
        type: string
      owner_id:
        type: integer
      resource_group_id:
        type: integer
      ssh_credential_id:
        maxLength: 64
        type: string
      ssh_key:
        type: string
      ssh_password:
        type: string
      ssh_port:
        maximum: 65535
        minimum: 1
        type: integer
      ssh_username:
        description: Direct credential fields for creation (will be stored via credential
          management)
        maxLength: 64
        type: string
    required:
    - host
    - hostname
    - name
    - owner_id
    type: object
  request.DisableTOTPRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  request.EmailAuthRequest:
    properties:
      enabled:
        type: boolean
      expires_in:
        type: integer
    type: object
  request.EmailMethodRequest:
    properties:
      code_length:
        type: integer
      enabled:
        type: boolean
      expires_in:
        type: integer
      rate_limit:
        type: integer
      template:
        type: string
    type: object
  request.EnableEmailTwoFactorRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  request.ForgotPasswordRequest:
    properties:
      username:
        example: john@example.com
        type: string
    required:
    - username
    type: object
  request.LoginSecurityRequest:
    properties:
      allowed_login_hours:
        type: string
      ip_whitelist:
        items:
          type: string
        type: array
      ip_whitelist_enabled:
        type: boolean
      lockout_duration:
        maximum: 86400
        minimum: 60
        type: integer
      login_time_restriction:
        type: boolean
      max_login_attempts:
        maximum: 20
        minimum: 1
        type: integer
    type: object
  request.NotificationSettingsRequest:
    properties:
      email_notifications:
        type: boolean
      marketing_emails:
        type: boolean
      push_notifications:
        type: boolean
      sms_notifications:
        type: boolean
    type: object
  request.OAuth2LoginConfigRequest:
    properties:
      auto_register:
        type: boolean
      default_role:
        type: string
      enabled:
        type: boolean
      providers:
        items:
          $ref: '#/definitions/request.OAuth2ProviderRequest'
        type: array
    type: object
  request.OAuth2LoginRequest:
    properties:
      code:
        example: authorization_code
        type: string
      provider:
        example: github
        type: string
      state:
        example: random_state
        type: string
    required:
    - code
    - provider
    - state
    type: object
  request.OAuth2ProviderRequest:
    properties:
      authorize_url:
        type: string
      auto_register:
        type: boolean
      client_id:
        type: string
      client_secret:
        type: string
      enabled:
        type: boolean
      name:
        type: string
      redirect_uri:
        type: string
      scopes:
        items:
          type: string
        type: array
      sort_order:
        type: integer
      token_url:
        type: string
      user_info_url:
        type: string
      user_mapping:
        additionalProperties:
          type: string
        type: object
    type: object
  request.OAuth2Request:
    properties:
      authorize_endpoint:
        type: string
      default_scopes:
        items:
          type: string
        type: array
      enabled:
        type: boolean
      token_endpoint:
        type: string
    type: object
  request.PasswordPolicyRequest:
    properties:
      max_length:
        maximum: 128
        minimum: 1
        type: integer
      min_length:
        maximum: 128
        minimum: 1
        type: integer
      password_expires_days:
        maximum: 365
        minimum: 0
        type: integer
      require_lowercase:
        type: boolean
      require_numbers:
        type: boolean
      require_symbols:
        type: boolean
      require_uppercase:
        type: boolean
    type: object
  request.ProfileChangePasswordRequest:
    properties:
      confirm_password:
        example: newpass123
        type: string
      new_password:
        example: newpass123
        minLength: 6
        type: string
      old_password:
        example: oldpass123
        type: string
    required:
    - confirm_password
    - new_password
    - old_password
    type: object
  request.ResendVerificationRequest:
    properties:
      username:
        example: john@example.com
        type: string
    required:
    - username
    type: object
  request.ResetPasswordRequest:
    properties:
      new_password:
        example: newpassword123
        type: string
      token:
        example: abc123def456
        type: string
    required:
    - new_password
    - token
    type: object
  request.RevokeAPITokenRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  request.RolePermissionRequest:
    properties:
      permission_ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - permission_ids
    type: object
  request.SecretKeyCreateRequest:
    properties:
      authorized_users:
        description: '@Schema(example="[1,2,3]")'
        items:
          type: integer
        type: array
      custom_fields:
        allOf:
        - $ref: '#/definitions/model.CustomFields'
        description: '@Schema(example="{\"rotation_interval\":90}")'
      description:
        example: MySQL database connection credentials
        type: string
      encrypted_value:
        example: username:password or key content
        type: string
      expires_at:
        example: "2025-12-31T23:59:59Z"
        type: string
      key_type:
        allOf:
        - $ref: '#/definitions/model.SecretKeyType'
        enum:
        - API_KEY
        - DATABASE
        - SSH
        - CERTIFICATE
        - CUSTOM
        example: DATABASE
      name:
        example: Database Connection Key
        maxLength: 64
        minLength: 1
        type: string
      resource_group_id:
        example: 1
        type: integer
    required:
    - encrypted_value
    - key_type
    - name
    type: object
  request.SecretKeyUpdateRequest:
    properties:
      encrypted_value:
        example: new_username:new_password
        type: string
      key_type:
        allOf:
        - $ref: '#/definitions/model.SecretKeyType'
        enum:
        - API_KEY
        - DATABASE
        - SSH
        - CERTIFICATE
        - CUSTOM
        example: DATABASE
    required:
    - encrypted_value
    - key_type
    type: object
  request.SecuritySettingsRequest:
    properties:
      login_alerts:
        type: boolean
      session_timeout:
        minimum: 0
        type: integer
    type: object
  request.ServerActionRequest:
    properties:
      action:
        enum:
        - restart
        - shutdown
        - update_agent
        - run_command
        type: string
      params:
        additionalProperties: true
        type: object
      server_ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - action
    - server_ids
    type: object
  request.ServerStatusCheckRequest:
    properties:
      check_types:
        items:
          type: string
        type: array
      server_ids:
        items:
          type: integer
        minItems: 1
        type: array
      timeout:
        maximum: 300
        minimum: 5
        type: integer
    required:
    - server_ids
    type: object
  request.SessionConfigRequest:
    properties:
      max_concurrent_sessions:
        type: integer
      remember_me_duration:
        type: integer
      remember_me_enabled:
        type: boolean
      timeout:
        type: integer
    type: object
  request.SwitchLanguageRequest:
    properties:
      language:
        maxLength: 10
        minLength: 2
        type: string
    required:
    - language
    type: object
  request.TOTPMethodRequest:
    properties:
      algorithm:
        type: string
      backup_codes_count:
        type: integer
      digits:
        type: integer
      enabled:
        type: boolean
      issuer:
        type: string
      period:
        type: integer
    type: object
  request.TagAssignRequest:
    properties:
      replaceAll:
        example: false
        type: boolean
      resourceId:
        example: 123
        type: integer
      tagIds:
        items:
          type: integer
        type: array
      tagNames:
        items:
          type: string
        type: array
    required:
    - resourceId
    type: object
  request.TagCreateRequest:
    properties:
      color:
        example: '#ff0000'
        maxLength: 16
        type: string
      description:
        example: Production environment tag
        maxLength: 500
        type: string
      name:
        example: production
        maxLength: 128
        type: string
    required:
    - name
    type: object
  request.TagUnassignRequest:
    properties:
      resourceId:
        example: 123
        type: integer
      tagIds:
        items:
          type: integer
        type: array
    required:
    - resourceId
    - tagIds
    type: object
  request.TagUpdateRequest:
    properties:
      color:
        example: '#ff0000'
        maxLength: 16
        type: string
      description:
        example: Production environment tag
        maxLength: 500
        type: string
      name:
        example: production
        maxLength: 128
        type: string
    required:
    - name
    type: object
  request.TestSMTPRequest:
    properties:
      test_email:
        type: string
    required:
    - test_email
    type: object
  request.TokenAuthRequest:
    properties:
      algorithm:
        type: string
      auto_refresh:
        type: boolean
      expires_in:
        type: integer
      refresh_expires_in:
        type: integer
      secret:
        type: string
    type: object
  request.TwoFactorMethodsRequest:
    properties:
      email:
        $ref: '#/definitions/request.EmailMethodRequest'
      totp:
        $ref: '#/definitions/request.TOTPMethodRequest'
    type: object
  request.TwoFactorRequest:
    properties:
      enabled:
        type: boolean
      methods:
        $ref: '#/definitions/request.TwoFactorMethodsRequest'
      required_roles:
        items:
          type: string
        type: array
    type: object
  request.UpdateAuthConfigRequest:
    properties:
      api_auth:
        $ref: '#/definitions/request.APIAuthRequest'
      session_config:
        $ref: '#/definitions/request.SessionConfigRequest'
      user_auth:
        $ref: '#/definitions/request.UserAuthRequest'
    type: object
  request.UpdatePermissionRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
      sort_order:
        type: integer
      status:
        enum:
        - -1
        - 0
        - 1
        type: integer
    type: object
  request.UpdateRoleRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
      permission_ids:
        items:
          type: integer
        type: array
      sort_order:
        type: integer
      status:
        enum:
        - -1
        - 0
        - 1
        type: integer
    type: object
  request.UpdateServerRequest:
    properties:
      description:
        type: string
      host:
        maxLength: 255
        type: string
      hostname:
        maxLength: 255
        type: string
      internal_ip:
        type: string
      ipv6_address:
        type: string
      name:
        maxLength: 64
        type: string
      resource_group_id:
        type: integer
      ssh_credential_id:
        maxLength: 64
        type: string
      ssh_key:
        type: string
      ssh_password:
        type: string
      ssh_port:
        maximum: 65535
        minimum: 1
        type: integer
      ssh_username:
        description: Direct credential fields for updates (will be stored via credential
          management)
        maxLength: 64
        type: string
    type: object
  request.UpdateSystemConfigRequest:
    properties:
      category:
        type: string
      config_key:
        type: string
      config_type:
        enum:
        - STRING
        - BOOLEAN
        - NUMBER
        - JSON
        type: string
      config_value:
        type: string
      description:
        type: string
      sort_order:
        type: integer
    required:
    - category
    - config_key
    - config_type
    - config_value
    type: object
  request.UserAuthRequest:
    properties:
      basic_auth:
        allOf:
        - $ref: '#/definitions/request.BasicAuthRequest'
        description: Basic authentication configuration
      email_auth:
        allOf:
        - $ref: '#/definitions/request.EmailAuthRequest'
        description: Email authentication configuration
      login_security:
        allOf:
        - $ref: '#/definitions/request.LoginSecurityRequest'
        description: Login security configuration
      oauth2:
        allOf:
        - $ref: '#/definitions/request.OAuth2LoginConfigRequest'
        description: OAuth2 configuration
      password_policy:
        allOf:
        - $ref: '#/definitions/request.PasswordPolicyRequest'
        description: Password policy configuration
      two_factor:
        allOf:
        - $ref: '#/definitions/request.TwoFactorRequest'
        description: Two-factor authentication configuration
    type: object
  request.UserCreateRequest:
    type: object
  request.UserLoginRequest:
    properties:
      password:
        example: "123456"
        type: string
      username:
        example: john@example.com or johndoe
        type: string
    required:
    - password
    - username
    type: object
  request.UserPasswordUpdateRequest:
    properties:
      new_password:
        example: newpassword123
        type: string
    required:
    - new_password
    type: object
  request.UserProfileUpdateRequest:
    properties:
      avatar:
        example: https://example.com/avatar.jpg
        type: string
      gender:
        description: 0-unknown, 1-male, 2-female
        enum:
        - 0
        - 1
        - 2
        example: 1
        type: integer
      language:
        example: zh-CN
        type: string
      nickname:
        example: John Doe
        type: string
      phone:
        example: "+1234567890"
        type: string
      signature:
        example: This is my signature
        type: string
      timezone:
        example: Asia/Shanghai
        type: string
    type: object
  request.UserRegisterRequest:
    properties:
      password:
        example: "123456"
        type: string
      username:
        example: john@example.com
        type: string
    required:
    - password
    - username
    type: object
  request.UserUpdateRequest:
    type: object
  request.UserUpdateStatusRequest:
    properties:
      status:
        example: 1
        maximum: 1
        minimum: 0
        type: integer
    type: object
  request.VerifyTwoFactorRequest:
    properties:
      code:
        type: string
      method:
        enum:
        - totp
        - email
        - backup
        type: string
      user_id:
        type: integer
    required:
    - code
    - method
    - user_id
    type: object
  response.APIAuthResponse:
    properties:
      oauth2:
        $ref: '#/definitions/response.OAuth2Response'
      token_auth:
        $ref: '#/definitions/response.TokenAuthResponse'
    type: object
  response.APITokenResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      expires_at:
        type: string
      id:
        type: integer
      last_used_at:
        type: string
      name:
        type: string
      scopes:
        items:
          type: string
        type: array
      token:
        description: only return complete token when creates
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  response.ActionStatItem:
    properties:
      action:
        example: READ
        type: string
      count:
        example: 800
        type: integer
    type: object
  response.AlertRecordListResponse:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      records:
        items:
          $ref: '#/definitions/response.AlertRecordResponse'
        type: array
      total:
        type: integer
    type: object
  response.AlertRecordResponse:
    properties:
      acknowledge_note:
        type: string
      acknowledged_at:
        type: string
      acknowledged_by:
        type: integer
      alert_id:
        type: string
      alert_rule_id:
        type: integer
      created_at:
        type: string
      description:
        type: string
      fired_at:
        type: string
      id:
        type: integer
      notification_sent:
        type: boolean
      resolution_note:
        type: string
      resolved_at:
        type: string
      severity:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  response.AlertRuleListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/response.AlertRuleResponse'
        type: array
      total:
        type: integer
    type: object
  response.AlertRuleResponse:
    properties:
      condition_expression:
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_enabled:
        type: boolean
      metric_name:
        type: string
      name:
        type: string
      notification_channels:
        type: string
      owner_id:
        type: integer
      rule_type:
        $ref: '#/definitions/model.AlertRuleType'
      target_id:
        type: integer
      target_type:
        $ref: '#/definitions/model.TargetType'
      updated_at:
        type: string
    type: object
  response.AuditLogListResponse:
    properties:
      items:
        description: 审计日志列表
        items:
          $ref: '#/definitions/response.AuditLogResponse'
        type: array
      page:
        description: 当前页码
        type: integer
      page_size:
        description: 每页数量
        type: integer
      total:
        description: 总记录数
        type: integer
      total_pages:
        description: 总页数
        type: integer
    type: object
  response.AuditLogResponse:
    properties:
      action:
        example: CREATE
        type: string
      created_at:
        example: "2025-07-15T10:30:00Z"
        type: string
      description:
        example: 创建应用实例：我的博客
        type: string
      error_message:
        type: string
      id:
        example: 1
        type: integer
      ip_address:
        example: 192.168.1.100
        type: string
      module:
        example: APP
        type: string
      request_data: {}
      request_method:
        example: POST
        type: string
      request_url:
        example: /api/v1/applications
        type: string
      resource_id:
        example: 123
        type: integer
      resource_name:
        example: 我的博客
        type: string
      resource_type:
        example: APP_INSTANCE
        type: string
      response_status:
        example: 200
        type: integer
      response_time:
        example: 1500
        type: integer
      success:
        example: true
        type: boolean
      user:
        $ref: '#/definitions/response.AuditLogUserResponse'
      user_agent:
        example: Mozilla/5.0
        type: string
    type: object
  response.AuditLogStatisticsResponse:
    properties:
      failed_operations:
        example: 50
        type: integer
      success_operations:
        example: 1200
        type: integer
      success_rate:
        example: 96
        type: number
      timeline:
        items:
