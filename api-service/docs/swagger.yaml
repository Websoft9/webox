      expires_in:
        type: integer
    type: object
  response.EmailMethodResponse:
    properties:
      code_length:
        type: integer
      enabled:
        type: boolean
      expires_in:
        type: integer
      rate_limit:
        type: integer
      template:
        type: string
    type: object
  response.LoginHistoryItem:
    properties:
