basePath: /
definitions:
  request.APIAuthRequest:
    properties:
      jwt_config:
        $ref: '#/definitions/request.JWTConfigRequest'
      oauth2_enabled:
        type: boolean
      token_auth_enabled:
        type: boolean
    type: object
  request.BatchRevokeAPITokensRequest:
    properties:
      ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - ids
    type: object
  request.ConfirmTOTPRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  request.CreateAPITokenRequest:
    properties:
      description:
        maxLength: 500
        type: string
      expires_at:
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
      scopes:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - name
    - scopes
    type: object
  request.CreatePermissionRequest:
    properties:
      action:
        maxLength: 32
        minLength: 2
        type: string
      code:
        maxLength: 64
        minLength: 2
        type: string
      description:
        maxLength: 500
        type: string
      is_menu:
        type: boolean
      module:
        maxLength: 32
        minLength: 2
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
      parent_id:
        type: integer
      resource:
        maxLength: 64
        type: string
      scope:
        enum:
        - platform
        - project
        type: string
      sort_order:
        type: integer
      status:
        enum:
        - -1
        - 0
        - 1
        type: integer
    required:
    - action
    - code
    - module
    - name
    - scope
    type: object
  request.CreateRoleRequest:
    properties:
      code:
        maxLength: 32
        minLength: 2
        type: string
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
      permission_ids:
        items:
          type: integer
        type: array
      sort_order:
        type: integer
      status:
        enum:
        - -1
        - 0
        - 1
        type: integer
    required:
    - code
    - name
    type: object
  request.DisableTOTPRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  request.EnableEmailTwoFactorRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  request.ForgotPasswordRequest:
    properties:
      username:
        example: john@example.com
        type: string
    required:
    - username
    type: object
  request.JWTConfigRequest:
    properties:
      algorithm:
        type: string
      auto_refresh:
        type: boolean
      expires_in:
        type: integer
      refresh_expires_in:
        type: integer
    type: object
  request.LoginSecurityRequest:
    properties:
      allowed_login_hours:
        type: string
      ip_whitelist:
        items:
          type: string
        type: array
      ip_whitelist_enabled:
        type: boolean
      lockout_duration:
        maximum: 86400
        minimum: 60
        type: integer
      login_time_restriction:
        type: boolean
      max_login_attempts:
        maximum: 20
        minimum: 1
        type: integer
    type: object
  request.OAuth2LoginRequest:
    properties:
      code:
        example: authorization_code
        type: string
      provider:
        example: github
        type: string
      state:
        example: random_state
        type: string
    required:
    - code
    - provider
    - state
    type: object
  request.OAuth2ProviderRequest:
    properties:
      auto_register:
        type: boolean
      client_id:
        type: string
      client_secret:
        type: string
      enabled:
        type: boolean
      name:
        type: string
      provider:
        type: string
      redirect_uri:
        type: string
      scopes:
        items:
          type: string
        type: array
      user_mapping:
        additionalProperties:
          type: string
        type: object
    type: object
  request.PasswordPolicyRequest:
    properties:
      max_length:
        maximum: 128
        minimum: 1
        type: integer
      min_length:
        maximum: 128
        minimum: 1
        type: integer
      password_expires_days:
        maximum: 365
        minimum: 0
        type: integer
      password_history:
        maximum: 20
        minimum: 0
        type: integer
      require_lowercase:
        type: boolean
      require_numbers:
        type: boolean
      require_symbols:
        type: boolean
      require_uppercase:
        type: boolean
    type: object
  request.ResendVerificationRequest:
    properties:
      username:
        example: john@example.com
        type: string
    required:
    - username
    type: object
  request.ResetPasswordRequest:
    properties:
      new_password:
        example: newpassword123
        minLength: 6
        type: string
      token:
        example: abc123def456
        type: string
    required:
    - new_password
    - token
    type: object
  request.RolePermissionRequest:
    properties:
      permission_ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - permission_ids
    type: object
  request.SessionConfigRequest:
    properties:
      max_concurrent_sessions:
        type: integer
      remember_me_duration:
        type: integer
      remember_me_enabled:
        type: boolean
      timeout:
        type: integer
    type: object
  request.UpdateAPITokenRequest:
    properties:
      description:
        maxLength: 500
        type: string
      expires_at:
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
      scopes:
        items:
          type: string
        type: array
    type: object
  request.UpdateAuthConfigRequest:
    properties:
      api_auth:
        $ref: '#/definitions/request.APIAuthRequest'
      session_config:
        $ref: '#/definitions/request.SessionConfigRequest'
      user_auth:
        $ref: '#/definitions/request.UserAuthRequest'
    type: object
  request.UpdatePermissionRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
      sort_order:
        type: integer
      status:
        enum:
        - -1
        - 0
        - 1
        type: integer
    type: object
  request.UpdateRoleRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
      permission_ids:
        items:
          type: integer
        type: array
      sort_order:
        type: integer
      status:
        enum:
        - -1
        - 0
        - 1
        type: integer
    type: object
  request.UserAuthRequest:
    properties:
      login_security:
        $ref: '#/definitions/request.LoginSecurityRequest'
      oauth2_enabled:
        type: boolean
      oauth2_providers:
        items:
          $ref: '#/definitions/request.OAuth2ProviderRequest'
        type: array
      password_policy:
        $ref: '#/definitions/request.PasswordPolicyRequest'
      two_factor_enabled:
        type: boolean
      two_factor_methods:
        items:
          type: string
        type: array
      two_factor_required_roles:
        items:
          type: string
        type: array
    type: object
  request.UserChangePasswordRequest:
    properties:
      new_password:
        example: newpass123
        minLength: 6
        type: string
      old_password:
        example: oldpass123
        type: string
    required:
    - new_password
    - old_password
    type: object
  request.UserCreateRequest:
    properties:
      avatar:
        example: https://example.com/avatar.jpg
        type: string
      email:
        example: john@example.com
        type: string
      gender:
        example: 1
        maximum: 2
        minimum: 0
        type: integer
      language:
        example: zh-CN
        maxLength: 10
        type: string
      nickname:
        example: John Doe
        maxLength: 64
        type: string
      password:
        example: password123
        minLength: 6
        type: string
      phone:
        example: "+1234567890"
        maxLength: 20
        type: string
      signature:
        example: This is my signature
        maxLength: 255
        type: string
      status:
        example: 1
        maximum: 1
        minimum: 0
        type: integer
      timezone:
        example: Asia/Shanghai
        maxLength: 64
        type: string
      username:
        example: johndoe
        maxLength: 64
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  request.UserLoginRequest:
    properties:
      password:
        example: "123456"
        type: string
      username:
        example: john@example.com
        type: string
    required:
    - password
    - username
    type: object
  request.UserPasswordUpdateRequest:
    properties:
      new_password:
        example: newpassword123
        minLength: 6
        type: string
    required:
    - new_password
    type: object
  request.UserRegisterRequest:
    properties:
      password:
        example: "123456"
        minLength: 6
        type: string
      username:
        example: john@example.com
        type: string
    required:
    - password
    - username
    type: object
  request.UserUpdateRequest:
    properties:
      avatar:
        example: https://example.com/avatar.jpg
        type: string
      email:
        example: newemail@example.com
        type: string
      gender:
        example: 1
        maximum: 2
        minimum: 0
        type: integer
      language:
        example: zh-CN
        maxLength: 10
        type: string
      nickname:
        example: John Doe
        maxLength: 64
        type: string
      phone:
        example: "+1234567890"
        maxLength: 20
        type: string
      signature:
        example: This is my signature
        maxLength: 255
        type: string
      timezone:
        example: Asia/Shanghai
        maxLength: 64
        type: string
      username:
        example: johndoe
        maxLength: 64
        minLength: 3
        type: string
    type: object
  request.UserUpdateStatusRequest:
    properties:
      status:
        example: 1
        maximum: 1
        minimum: 0
        type: integer
    required:
    - status
    type: object
  request.ValidateAPITokenRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  request.VerifyTwoFactorRequest:
    properties:
      code:
        type: string
      method:
        enum:
        - totp
        - email
        - backup
        type: string
      user_id:
        type: integer
    required:
    - code
    - method
    - user_id
    type: object
  response.APIAuthResponse:
    properties:
      jwt_config:
        $ref: '#/definitions/response.JWTConfigResponse'
      oauth2_enabled:
        type: boolean
      token_auth_enabled:
        type: boolean
    type: object
  response.APIResponse:
    properties:
      code:
        example: 200
        type: integer
      data: {}
      error:
        example: Error message
        type: string
      message:
        example: Success
        type: string
    type: object
  response.APITokenListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/response.APITokenResponse'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  response.APITokenResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      expires_at:
        type: string
      id:
        type: integer
      last_used_at:
        type: string
      name:
        type: string
      scopes:
        items:
          type: string
        type: array
      token:
        description: only return complete token when creates
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  response.APITokenValidationResponse:
    properties:
      expires_at:
        type: string
      scopes:
        items:
          type: string
        type: array
      user_id:
        type: integer
      username:
        type: string
      valid:
        type: boolean
    type: object
  response.ActionStatItem:
    properties:
      action:
        example: READ
        type: string
      count:
        example: 800
        type: integer
    type: object
  response.AuditLogListResponse:
    properties:
      items:
        description: 审计日志列表
        items:
          $ref: '#/definitions/response.AuditLogResponse'
        type: array
      page:
        description: 当前页码
        type: integer
      page_size:
        description: 每页数量
        type: integer
      total:
        description: 总记录数
        type: integer
      total_pages:
        description: 总页数
        type: integer
    type: object
  response.AuditLogResponse:
    properties:
      action:
        example: CREATE
        type: string
      created_at:
        example: "2025-07-15T10:30:00Z"
        type: string
      description:
        example: 创建应用实例：我的博客
        type: string
      error_message:
        type: string
      id:
        example: 1
        type: integer
      ip_address:
        example: 192.168.1.100
        type: string
      module:
        example: APP
        type: string
      request_data: {}
      request_method:
        example: POST
        type: string
      request_url:
        example: /api/v1/applications
        type: string
      resource_id:
        example: 123
        type: integer
      resource_name:
        example: 我的博客
        type: string
      resource_type:
        example: APP_INSTANCE
        type: string
      response_status:
        example: 200
        type: integer
      response_time:
        example: 1500
        type: integer
      success:
        example: true
        type: boolean
      user:
        $ref: '#/definitions/response.AuditLogUserResponse'
      user_agent:
        example: Mozilla/5.0
        type: string
    type: object
  response.AuditLogStatisticsResponse:
    properties:
      failed_operations:
        example: 50
        type: integer
      success_operations:
        example: 1200
        type: integer
      success_rate:
        example: 96
        type: number
      timeline:
        items:
          $ref: '#/definitions/response.TimelineStatItem'
        type: array
      top_actions:
        items:
          $ref: '#/definitions/response.ActionStatItem'
        type: array
      top_users:
        items:
          $ref: '#/definitions/response.UserStatItem'
        type: array
      total_operations:
        example: 1250
        type: integer
    type: object
  response.AuditLogUserResponse:
    properties:
      id:
        example: 1
        type: integer
      nickname:
        example: 管理员
        type: string
      username:
        example: admin
        type: string
    type: object
  response.AuthConfigResponse:
    properties:
      api_auth:
        $ref: '#/definitions/response.APIAuthResponse'
      session_config:
        $ref: '#/definitions/response.SessionConfigResponse'
      user_auth:
