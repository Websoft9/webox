server:
  port: "8080"
  mode: "debug"
  log:
    log_leve: "debug"
    log_path: "logs/websoft9.log"
    log_max_size: 10
    log_max_backups: 5
    log_max_age: 30
    log_compress: true
  config:
    read_timeout: 60
    write_timeout: 60
    idle_timeout: 60
    read_header_timeout: 60
    max_header_bytes: 1048576
    
    # Server management configuration
    ssh:
      timeout: 30        # SSH connection timeout in seconds
      retry_count: 3     # SSH connection retry count
    
    file_management:
      upload_max_size: 104857600   # Maximum file upload size (100MB in bytes)
      download_max_size: 524288000 # Maximum file download size (500MB in bytes)

