version: "3.8"

services:
  application_service:
    image: nginx:1.25
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
      placement:
        constraints: [node.role == worker]
    ports:
      - "80:80"
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    volumes:
      - app_volumes_data:/home/websoft9/application/volumes/nginx/
    networks:
      - websoft9_app_cluster

volumes:
  app_volumes_data:

networks:
  websoft9_app_cluster:
    driver: overlay
