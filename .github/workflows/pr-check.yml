name: 🔍 PR Check

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]

# 添加必要的权限
permissions:
  contents: write # 需要写权限来删除分支
  pull-requests: write
  issues: write
  checks: write

env:
  GO_VERSION: "1.24.5"
  COVERAGE_THRESHOLD: 80

jobs:
  # 提交消息格式检查
  commit-message-check:
    name: 📝 Commit Message Check
    runs-on: ubuntu-latest
    if: github.event.action != 'edited'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          echo "检查提交消息格式..."

          # 确保脚本有执行权限
          chmod +x ./scripts/check-commit-message.sh

          # 获取 PR 中的所有提交
          commits=$(git rev-list --reverse ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})

          failed_commits=()

          for commit in $commits; do
            message=$(git log --format=%s -n 1 $commit)
            echo "检查提交: $commit"
            echo "消息: $message"

            if ! ./scripts/check-commit-message.sh "$message"; then
              failed_commits+=("$commit: $message")
            fi
          done

          if [ ${#failed_commits[@]} -gt 0 ]; then
            echo "❌ 以下提交消息格式不正确:"
            for failed in "${failed_commits[@]}"; do
              echo "  - $failed"
            done
            echo ""
            echo "请修改提交消息以符合 Conventional Commits 规范:"
            echo "格式: <type>[optional scope]: <description>"
            echo "示例: feat(auth): add JWT token refresh mechanism"
            exit 1
          fi

          echo "✅ 所有提交消息格式正确"

  # 代码格式检查
  code-format-check:
    name: 🎨 Code Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            api-service/go.sum
            websoft9-agent/go.sum

      - name: Check Go formatting
        run: |
          echo "检查 Go 代码格式..."

          # 检查 api-service
          cd api-service
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "❌ api-service 以下文件格式不正确:"
            echo "$unformatted"
            exit 1
          fi

          # 检查 websoft9-agent
          cd ../websoft9-agent
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "❌ websoft9-agent 以下文件格式不正确:"
            echo "$unformatted"
            exit 1
          fi

          echo "✅ Go 代码格式正确"

      - name: Run golangci-lint for api-service
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: api-service
          args: --timeout=5m --out-format=github-actions

      - name: Run golangci-lint for websoft9-agent
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: websoft9-agent
          args: --timeout=5m --out-format=github-actions

  # 单元测试
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    strategy:
      matrix:
        go-version: ["1.24.5"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: |
            api-service/go.sum
            websoft9-agent/go.sum

      - name: Run unit tests for api-service
        working-directory: api-service
        run: |
          echo "运行 api-service 单元测试..."
          mkdir -p reports

          # 运行测试并生成覆盖率报告
          go test -v -race -coverprofile=reports/coverage.out -covermode=atomic ./... | tee reports/test-results.txt

          # 生成覆盖率报告
          if [ -f "reports/coverage.out" ]; then
            go tool cover -html=reports/coverage.out -o reports/coverage.html
            go tool cover -func=reports/coverage.out > reports/coverage.txt

            # 计算总覆盖率
            total_coverage=$(go tool cover -func=reports/coverage.out | grep "total:" | awk '{print $3}' | sed 's/%//' || echo "0")
            echo "API Service 总覆盖率: ${total_coverage}%"
            echo "api_coverage=$total_coverage" >> $GITHUB_ENV
          fi

      - name: Run unit tests for websoft9-agent
        working-directory: websoft9-agent
        run: |
          echo "运行 websoft9-agent 单元测试..."
          mkdir -p reports

          # 运行测试并生成覆盖率报告
          go test -v -race -coverprofile=reports/coverage.out -covermode=atomic ./... | tee reports/test-results.txt

          # 生成覆盖率报告
          if [ -f "reports/coverage.out" ]; then
            go tool cover -html=reports/coverage.out -o reports/coverage.html
            go tool cover -func=reports/coverage.out > reports/coverage.txt

            # 计算总覆盖率
            total_coverage=$(go tool cover -func=reports/coverage.out | grep "total:" | awk '{print $3}' | sed 's/%//' || echo "0")
            echo "Agent 总覆盖率: ${total_coverage}%"
            echo "agent_coverage=$total_coverage" >> $GITHUB_ENV
          fi

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-go${{ matrix.go-version }}
          path: |
            api-service/reports/
            websoft9-agent/reports/
          retention-days: 30

      - name: Comment coverage on PR
        if: matrix.go-version == '1.24.5'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            try {
              const fs = require('fs');
              const path = require('path');

              // 获取覆盖率数据
              const apiCoverage = process.env.api_coverage || '0';
              const agentCoverage = process.env.agent_coverage || '0';
              const threshold = process.env.COVERAGE_THRESHOLD;

              // 计算平均覆盖率
              const avgCoverage = ((parseFloat(apiCoverage) + parseFloat(agentCoverage)) / 2).toFixed(1);
              const isWarning = parseFloat(avgCoverage) < parseFloat(threshold);

              let coverageIcon = '✅';
              if (isWarning) {
                coverageIcon = '⚠️';
              }

              let detailsSection = '';

              // 尝试读取覆盖率详细信息
              try {
                const apiCoverageFile = path.join('api-service', 'reports', 'coverage.txt');
                const agentCoverageFile = path.join('websoft9-agent', 'reports', 'coverage.txt');

                let apiDetails = '';
                let agentDetails = '';

                if (fs.existsSync(apiCoverageFile)) {
                  apiDetails = fs.readFileSync(apiCoverageFile, 'utf8');
                }

                if (fs.existsSync(agentCoverageFile)) {
                  agentDetails = fs.readFileSync(agentCoverageFile, 'utf8');
                }

                if (apiDetails || agentDetails) {
                  detailsSection = `
              <details>
              <summary>详细覆盖率信息</summary>

              ${apiDetails ? `**API Service:**
              \`\`\`
              ${apiDetails}
              \`\`\`
              ` : ''}

              ${agentDetails ? `**Websoft9 Agent:**
              \`\`\`
              ${agentDetails}
              \`\`\`
              ` : ''}

              </details>`;
                }
              } catch (error) {
                console.log('无法读取覆盖率详细信息:', error.message);
              }

              const comment = `## ${coverageIcon} 测试覆盖率报告

              | 组件 | 覆盖率 | 状态 |
              |------|--------|------|
              | API Service | ${apiCoverage}% | ${parseFloat(apiCoverage) >= parseFloat(threshold) ? '✅' : '⚠️'} |
              | Websoft9 Agent | ${agentCoverage}% | ${parseFloat(agentCoverage) >= parseFloat(threshold) ? '✅' : '⚠️'} |
              | **平均覆盖率** | **${avgCoverage}%** | **${isWarning ? '⚠️' : '✅'}** |

              **阈值:** ${threshold}%

              ${isWarning ? '⚠️ **警告:** 部分组件覆盖率低于阈值，建议增加测试用例' : '✅ 所有组件覆盖率达到要求'}
              ${detailsSection}
              `;

              // 查找现有的覆盖率评论
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const existingComment = comments.find(comment =>
                comment.body.includes('测试覆盖率报告')
              );

              if (existingComment) {
                // 更新现有评论
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: comment
                });
                console.log('✅ 覆盖率评论已更新');
              } else {
                // 创建新评论
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: comment
                });
                console.log('✅ 覆盖率评论已创建');
              }
            } catch (error) {
              console.log('⚠️ 无法创建或更新覆盖率评论:', error.message);
              console.log('覆盖率数据仍会在工作流日志中显示');

              // 在控制台输出覆盖率信息作为备选方案
              const apiCoverage = process.env.api_coverage || '0';
              const agentCoverage = process.env.agent_coverage || '0';
              const threshold = process.env.COVERAGE_THRESHOLD;
              const avgCoverage = ((parseFloat(apiCoverage) + parseFloat(agentCoverage)) / 2).toFixed(1);

              console.log('📊 测试覆盖率报告:');
              console.log(`API Service: ${apiCoverage}%`);
              console.log(`Websoft9 Agent: ${agentCoverage}%`);
              console.log(`平均覆盖率: ${avgCoverage}%`);
              console.log(`阈值: ${threshold}%`);
            }

  # 构建验证
  build-check:
    name: 🔨 Build Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ["api-service", "websoft9-agent"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build ${{ matrix.service }}
        run: |
          # 打印当前目录路径
          echo "当前工作目录: $(pwd)"
          echo "目录内容:"
          ls -la

          if [ ! -d "${{ matrix.service }}" ]; then
            echo "⏭️ 跳过 ${{ matrix.service }}，目录不存在"
            exit 0
          fi

          echo "构建 ${{ matrix.service }}..."
          cd ${{ matrix.service }}
          echo "切换到目录: $(pwd)"

          # 下载依赖
          go mod download

          # 构建
          if [ -f "Makefile" ]; then
            make build
          else
            go build -v ./...
          fi

          echo "✅ ${{ matrix.service }} 构建成功"

  # 安全扫描
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Gosec
        run: |
          echo "安装 Gosec 安全扫描工具..."
          go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run Gosec Security Scanner for api-service
        run: |
          echo "运行 api-service 安全扫描..."

          if [ ! -d "api-service" ]; then
            echo "⏭️ 跳过 api-service，目录不存在"
          else
            cd api-service
            mkdir -p reports

            echo "扫描 api-service Go 代码..."
            # 使用配置文件（如果存在）
            config_flag=""
            if [ -f "../.gosec.json" ]; then
              config_flag="-conf ../.gosec.json"
            fi

            if gosec $config_flag -fmt sarif -out reports/gosec-results.sarif ./... 2>/dev/null; then
              echo "✅ api-service SARIF 报告生成成功"
            else
              echo "⚠️ api-service SARIF 报告生成失败，尝试基本扫描"
              gosec $config_flag ./... || echo "⚠️ api-service 安全扫描完成（可能有警告）"
            fi

            # 生成 JSON 报告（用于调试）
            gosec $config_flag -fmt json -out reports/gosec-results.json ./... 2>/dev/null || true
            cd ../..
          fi

      - name: Run Gosec Security Scanner for websoft9-agent
        run: |
          echo "运行 websoft9-agent 安全扫描..."

          if [ ! -d "websoft9-agent" ]; then
            echo "⏭️ 跳过 websoft9-agent，目录不存在"
          else
            cd websoft9-agent
            mkdir -p reports

            echo "扫描 websoft9-agent Go 代码..."
            # 使用配置文件（如果存在）
            config_flag=""
            if [ -f "../.gosec.json" ]; then
              config_flag="-conf ../.gosec.json"
            fi

            if gosec $config_flag -fmt sarif -out reports/gosec-results.sarif ./... 2>/dev/null; then
              echo "✅ websoft9-agent SARIF 报告生成成功"
            else
              echo "⚠️ websoft9-agent SARIF 报告生成失败，尝试基本扫描"
              gosec $config_flag ./... || echo "⚠️ websoft9-agent 安全扫描完成（可能有警告）"
            fi

            # 生成 JSON 报告（用于调试）
            gosec $config_flag -fmt json -out reports/gosec-results.json ./... 2>/dev/null || true
            cd ../..
          fi

      - name: Upload Gosec scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gosec-security-reports
          path: |
            api-service/reports/gosec-*
            websoft9-agent/reports/gosec-*
          retention-days: 30

      - name: Upload Gosec scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('api-service/reports/gosec-results.sarif') != ''
        with:
          sarif_file: api-service/reports/gosec-results.sarif
          category: api-service-gosec

      - name: Upload Agent Gosec scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('websoft9-agent/reports/gosec-results.sarif') != ''
        with:
          sarif_file: websoft9-agent/reports/gosec-results.sarif
          category: websoft9-agent-gosec

  # Docker 构建检查
  docker-build-check:
    name: 🐳 Docker Build Check
    runs-on: ubuntu-latest
    needs: [build-check, security-scan]
    if: always() && needs.build-check.result == 'success'
    strategy:
      matrix:
        service: ["api-service", "websoft9-agent"]
        include:
          - service: api-service
            dockerfile: api-service/Dockerfile
            context: api-service
          - service: websoft9-agent
            dockerfile: websoft9-agent/Dockerfile
            context: websoft9-agent
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check if Dockerfile exists
        id: dockerfile-check
        run: |
          if [ ! -f "${{ matrix.context }}/Dockerfile" ]; then
            echo "⏭️ 跳过 ${{ matrix.service }}，Dockerfile 不存在"
            echo "dockerfile_exists=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "dockerfile_exists=true" >> $GITHUB_OUTPUT
          echo "✅ 找到 Dockerfile: ${{ matrix.context }}/Dockerfile"

      - name: Extract metadata for testing
        if: steps.dockerfile-check.outputs.dockerfile_exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: websoft9/${{ matrix.service }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=pr-{{branch}}-

      - name: Build Docker image (test only)
        if: steps.dockerfile-check.outputs.dockerfile_exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/${{ matrix.service }}-image.tar

      - name: Test Docker image
        if: steps.dockerfile-check.outputs.dockerfile_exists == 'true'
        run: |
          echo "测试 Docker 镜像..."

          # 加载镜像
          docker load -i /tmp/${{ matrix.service }}-image.tar

          # 获取镜像标签
          image_tag=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "测试镜像: $image_tag"

          # 检查镜像是否成功构建
          if docker images | grep -q "${{ matrix.service }}"; then
            echo "✅ Docker 镜像构建成功"
          else
            echo "❌ Docker 镜像构建失败"
            exit 1
          fi

          # 基本镜像检查
          echo "镜像信息:"
          docker inspect "$image_tag" --format='{{.Config.Cmd}}'
          docker inspect "$image_tag" --format='{{.Config.ExposedPorts}}'

          # 尝试运行容器进行基本测试（如果有健康检查）
          echo "尝试启动容器进行基本测试..."
          container_id=$(docker run -d "$image_tag" || echo "")

          if [ -n "$container_id" ]; then
            echo "容器启动成功: $container_id"

            # 等待几秒钟让容器启动
            sleep 5

            # 检查容器状态
            container_status=$(docker inspect "$container_id" --format='{{.State.Status}}')
            echo "容器状态: $container_status"

            # 获取容器日志
            echo "容器日志:"
            docker logs "$container_id" 2>&1 | head -20

            # 清理容器
            docker stop "$container_id" >/dev/null 2>&1 || true
            docker rm "$container_id" >/dev/null 2>&1 || true

            if [ "$container_status" = "running" ] || [ "$container_status" = "exited" ]; then
              echo "✅ 容器基本测试通过"
            else
              echo "⚠️ 容器状态异常，但镜像构建成功"
            fi
          else
            echo "⚠️ 无法启动容器进行测试，但镜像构建成功"
          fi

          # 清理镜像
          docker rmi "$image_tag" >/dev/null 2>&1 || true

          echo "✅ ${{ matrix.service }} Docker 构建检查完成"

      - name: Upload Docker build logs
        if: always() && steps.dockerfile-check.outputs.dockerfile_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-logs-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}-*.log
          retention-days: 7

      - name: Comment Docker build result
        if: always() && steps.dockerfile-check.outputs.dockerfile_exists == 'true'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const service = '${{ matrix.service }}';
            const success = '${{ job.status }}' === 'success';
            const icon = success ? '✅' : '❌';
            const status = success ? '成功' : '失败';

            const comment = `## ${icon} Docker 构建检查 - ${service}

            **状态:** ${status}
            **镜像:** websoft9/${service}
            **平台:** linux/amd64

            ${success ?
              '🎉 Docker 镜像构建成功，容器可以正常启动！' :
              '⚠️ Docker 镜像构建失败，请检查 Dockerfile 和构建日志。'
            }

            <details>
            <summary>构建详情</summary>

            - **Dockerfile 路径:** \`${service}/Dockerfile\`
            - **构建上下文:** \`${service}/\`
            - **目标平台:** linux/amd64
            - **缓存策略:** GitHub Actions Cache

            </details>
            `;

            // 查找现有的 Docker 构建评论
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(comment =>
              comment.body.includes(`Docker 构建检查 - ${service}`)
            );

            if (existingComment) {
              // 更新现有评论
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
              console.log(`✅ Docker 构建评论已更新 - ${service}`);
            } else {
              // 创建新评论
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
              console.log(`✅ Docker 构建评论已创建 - ${service}`);
            }

  # 最终状态检查
  pr-check-summary:
    name: 📊 PR Check Summary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    needs:
      [
        commit-message-check,
        code-format-check,
        unit-tests,
        build-check,
        security-scan,
        docker-build-check,
      ]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          echo "=== PR 检查结果汇总 ==="

          # 检查各个作业的状态
          commit_check="${{ needs.commit-message-check.result }}"
          code_format="${{ needs.code-format-check.result }}"
          unit_tests="${{ needs.unit-tests.result }}"
          build_check="${{ needs.build-check.result }}"
          security_scan="${{ needs.security-scan.result }}"
          docker_build="${{ needs.docker-build-check.result }}"

          echo "提交消息检查: $commit_check"
          echo "代码格式检查: $code_format"
          echo "单元测试: $unit_tests"
          echo "构建检查: $build_check"
          echo "安全扫描: $security_scan"
          echo "Docker构建检查: $docker_build"

          # 检查是否有失败的作业
          failed_jobs=()

          [ "$commit_check" = "failure" ] && failed_jobs+=("提交消息检查")
          [ "$code_format" = "failure" ] && failed_jobs+=("代码格式检查")
          [ "$unit_tests" = "failure" ] && failed_jobs+=("单元测试")
          [ "$build_check" = "failure" ] && failed_jobs+=("构建检查")
          [ "$security_scan" = "failure" ] && failed_jobs+=("安全扫描")
          [ "$docker_build" = "failure" ] && failed_jobs+=("Docker构建检查")

          if [ ${#failed_jobs[@]} -gt 0 ]; then
            echo ""
            echo "❌ 以下检查失败:"
            for job in "${failed_jobs[@]}"; do
              echo "  - $job"
            done
            echo ""
            echo "请修复失败的检查项后重新提交"
            exit 1
          fi

          echo ""
          echo "✅ 所有 PR 检查通过！"

      - name: Comment PR check summary
        if: always()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            try {
              const needs = ${{ toJSON(needs) }};

              let summary = '## 📊 PR 检查结果汇总\n\n';
              let allPassed = true;
              let failedJobs = [];

              const jobs = [
                { name: '提交消息检查', key: 'commit-message-check' },
                { name: '代码格式检查', key: 'code-format-check' },
                { name: '单元测试', key: 'unit-tests' },
                { name: '构建检查', key: 'build-check' },
                { name: '安全扫描', key: 'security-scan' },
                { name: 'Docker构建检查', key: 'docker-build-check' }
              ];

              for (const job of jobs) {
                const result = needs[job.key]?.result || 'skipped';
                let icon = '✅';

                if (result === 'failure') {
                  icon = '❌';
                  allPassed = false;
                  failedJobs.push(job.name);
                } else if (result === 'cancelled') {
                  icon = '⏹️';
                } else if (result === 'skipped') {
                  icon = '⏭️';
                }

                summary += `${icon} **${job.name}:** ${result}\n`;
              }

              summary += '\n';

              if (allPassed) {
                summary += '🎉 **所有检查通过！** 此 PR 可以合并。';
              } else {
                summary += '⚠️ **部分检查失败** 请修复失败的检查项后重新提交。\n\n';
                summary += '### 🔧 修复建议\n\n';

                if (failedJobs.includes('提交消息检查')) {
                  summary += '- **提交消息格式**: 请使用 Conventional Commits 格式，如 `feat(auth): add login functionality`\n';
                }
                if (failedJobs.includes('代码格式检查')) {
                  summary += '- **代码格式**: 运行 `gofmt -w .` 和 `golangci-lint run` 修复格式问题\n';
                }
                if (failedJobs.includes('单元测试')) {
                  summary += '- **单元测试**: 修复失败的测试用例，确保测试覆盖率达到要求\n';
                }
                if (failedJobs.includes('构建检查')) {
                  summary += '- **构建问题**: 检查编译错误和依赖问题\n';
                }
                if (failedJobs.includes('安全扫描')) {
                  summary += '- **安全问题**: 修复 Gosec 扫描发现的安全漏洞\n';
                }
                if (failedJobs.includes('Docker构建检查')) {
                  summary += '- **Docker构建**: 检查 Dockerfile 语法和构建配置，确保镜像可以正常构建\n';
                }

                summary += '\n---\n\n';
                summary += '💡 **提示**: 如果需要帮助，请查看 [开发规范文档](https://github.com/Websoft9/webox/blob/develop/docs/开发规范.md) 或联系团队成员。\n\n';
                summary += '⚠️ **注意**: 连续多次检查失败可能会导致此 PR 被自动关闭，请及时修复问题。';
              }

              // 查找现有的汇总评论
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const existingComment = comments.find(comment =>
                comment.body.includes('PR 检查结果汇总')
              );

              if (existingComment) {
                // 更新现有评论
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: summary
                });
                console.log('✅ PR 检查汇总评论已更新');
              } else {
                // 创建新评论
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: summary
                });
                console.log('✅ PR 检查汇总评论已创建');
              }

              // 设置输出变量供后续步骤使用
              core.setOutput('all_passed', allPassed);
              core.setOutput('failed_jobs', failedJobs.join(','));

            } catch (error) {
              console.log('⚠️ 无法创建或更新 PR 检查汇总评论:', error.message);
              console.log('检查结果仍会在工作流日志中显示');

              // 在控制台输出汇总信息作为备选方案
              const needs = ${{ toJSON(needs) }};
              console.log('📊 PR 检查结果汇总:');

              const jobs = [
                { name: '提交消息检查', key: 'commit-message-check' },
                { name: '代码格式检查', key: 'code-format-check' },
                { name: '单元测试', key: 'unit-tests' },
                { name: '构建检查', key: 'build-check' },
                { name: '安全扫描', key: 'security-scan' },
                { name: 'Docker构建检查', key: 'docker-build-check' }
              ];

              let allPassed = true;
              for (const job of jobs) {
                const result = needs[job.key]?.result || 'skipped';
                console.log(`${job.name}: ${result}`);
                if (result === 'failure') {
                  allPassed = false;
                }
              }

              // 设置输出变量
              core.setOutput('all_passed', allPassed);
            }

      - name: Handle failed PR checks
        if: always()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            try {
              const needs = ${{ toJSON(needs) }};

              // 检查是否有失败的作业
              let hasFailures = false;
              const jobs = ['commit-message-check', 'code-format-check', 'unit-tests', 'build-check', 'security-scan'];

              for (const job of jobs) {
                if (needs[job]?.result === 'failure') {
                  hasFailures = true;
                  break;
                }
              }

              if (!hasFailures) {
                console.log('✅ 所有检查通过，无需处理失败情况');
                return;
              }

              console.log('⚠️ 检测到检查失败，开始处理...');

              // 获取 PR 信息
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });

              const branchName = pr.head.ref;
              const prAuthor = pr.user.login;
              const prTitle = pr.title;

              // 检查是否是 fork 的 PR（不能删除 fork 仓库的分支）
              const isFork = pr.head.repo.full_name !== pr.base.repo.full_name;

              console.log(`PR 信息: 分支=${branchName}, 作者=${prAuthor}, 标题=${prTitle}, 是否Fork=${isFork}`);

              // 获取 PR 的历史检查失败次数
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              // 计算失败次数（通过查找包含"检查失败"的评论）
              const failureComments = comments.filter(comment =>
                comment.body.includes('⚠️ **部分检查失败**') ||
                comment.body.includes('🚨 PR 检查连续失败警告')
              );

              const failureCount = failureComments.length;
              const maxFailures = 1; // 最大允许失败次数

              console.log(`当前失败次数: ${failureCount}/${maxFailures}`);

              if (failureCount >= maxFailures) {
                // 达到最大失败次数，发送最终警告并准备关闭 PR
                const finalWarning = `## 🚨 PR 自动关闭通知

              @${prAuthor} 您好，

              此 PR 已连续 **${failureCount}** 次检查失败，根据项目规范将被自动关闭。

              ### 📋 失败原因汇总
              请查看上方的检查结果，修复所有失败项后重新创建 PR。

              ### 🔄 后续操作建议
              1. 在本地修复所有检查失败的问题
              2. 确保代码符合项目规范
              3. 运行本地测试确保通过
              4. 重新创建 PR

              ### 📚 参考资源
              - [开发规范文档](https://github.com/Websoft9/webox/blob/develop/docs/开发规范.md)
              - [Git 工作流规范](https://github.com/Websoft9/webox/blob/develop/docs/开发规范.md#4-版本控制规范)

              ---

              **此 PR 将在 1 分钟后自动关闭。** 如有疑问，请联系项目维护者。
              `;

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: finalWarning
                });

                // 添加标签
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: ['auto-close', 'checks-failed']
                });

                // 等待 1 分钟后关闭 PR
                console.log('⏰ 等待 1 分钟后关闭 PR...');
                await new Promise(resolve => setTimeout(resolve, 1 * 60 * 1000)); // 1 分钟

                // 关闭 PR
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  state: 'closed'
                });

                console.log('🔒 PR 已自动关闭');

                // 如果不是 fork，尝试删除分支
                if (!isFork && branchName !== 'main' && branchName !== 'develop') {
                  try {
                    await github.rest.git.deleteRef({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      ref: `heads/${branchName}`
                    });
                    console.log(`🗑️ 分支 ${branchName} 已自动删除`);

                    // 添加删除分支的评论
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: context.issue.number,
                      body: `🗑️ **分支已删除**: \`${branchName}\` 分支已自动删除。`
                    });
                  } catch (deleteError) {
                    console.log(`⚠️ 无法删除分支 ${branchName}:`, deleteError.message);
                  }
                } else {
                  const reason = isFork ? 'Fork 仓库分支' : '受保护的分支';
                  console.log(`⏭️ 跳过删除分支: ${reason}`);
                }

              } else if (failureCount >= Math.floor(maxFailures / 2)) {
                // 达到一半失败次数，发送警告
                const warningMessage = `## ⚠️ PR 检查失败警告

              @${prAuthor} 您好，

              此 PR 已连续 **${failureCount}** 次检查失败。为了保持代码质量，请尽快修复以下问题：

              ### 🔧 需要修复的问题
              请查看上方的详细检查结果和修复建议。

              ### ⏰ 重要提醒
              - 最多允许连续失败 **${maxFailures}** 次
              - 超过限制后 PR 将被自动关闭
              - 剩余机会：**${maxFailures - failureCount}** 次

              ### 💡 建议
              1. 仔细阅读检查失败的详细信息
              2. 在本地环境修复所有问题
              3. 确保本地测试通过后再推送

              感谢您的理解与配合！
              `;

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: warningMessage
                });

                // 添加警告标签
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: ['checks-failed', 'needs-fix']
                });

                console.log(`⚠️ 已发送第 ${failureCount} 次失败警告`);
              } else {
                console.log(`📝 记录第 ${failureCount} 次检查失败`);
              }

            } catch (error) {
              console.log('⚠️ 处理失败 PR 检查时出错:', error.message);
              console.log('错误详情:', error);
            }
