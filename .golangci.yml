# Websoft9 project golangci-lint configuration
# Based on development standard document requirements
# Compatible with golangci-lint v1.x format

run:
  timeout: 5m
  tests: false
  go: "1.21"

output:
  formats:
    - format: colored-line-number

linters-settings:
  govet:
    enable:
      - shadow

  gocyclo:
    min-complexity: 15

  dupl:
    threshold: 100

  goconst:
    min-len: 2
    min-occurrences: 2

  misspell:
    locale: US

  lll:
    line-length: 260

  goimports:
    local-prefixes: github.com/websoft9

  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - dupImport
      - ifElseChain
      - octalLiteral
      - whyNoLint
      - wrapperFunc

  funlen:
    lines: 100
    statements: 50

  gocognit:
    min-complexity: 30

  nestif:
    min-complexity: 15

  mnd:
    checks:
      - argument
      - case
      - condition
      - operation
      - return
      - assign

  gomodguard:
    allowed:
      modules: []
      domains: []
    blocked:
      modules: []
      versions: []

  godox:
    keywords:
      - NOTE
      - OPTIMIZE
      - HACK

  dogsled:
    max-blank-identifiers: 2

  whitespace:
    multi-if: false
    multi-func: false

linters:
  disable-all: true
  enable:
    # Error checking
    - errcheck
    - staticcheck # includes gosimple, stylecheck
    - govet
    - ineffassign
    - typecheck
    - unused

    # Security checking
    - gosec

    # Performance checking
    - bodyclose
    - rowserrcheck
    - sqlclosecheck

    # Code quality
    # - dupl
    - goconst
    - gocritic
    - mnd # replaces gomnd
    - goprintffuncname
    - nakedret
    - prealloc
    - unconvert
    - unparam

    # Complexity checking
    - gocyclo
    - gocognit
    - funlen
    - nestif

    # Others
    - dogsled
    - godox
    - gomodguard
    - misspell
    - whitespace
    - lll

    # Formatting
    - gofmt
    - goimports

issues:
  exclude-dirs:
    - vendor
    - .git
    - bin
    - build
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*_mock\\.go$"
  exclude-rules:
    # Exclude certain checks for test files
    - path: '_test\.go'
      linters:
        - mnd
        - funlen
        - goconst
        - dupl

    # Exclude generated files
    - path: ".*\\.pb\\.go"
      linters:
        - lll
        - govet

    # Exclude mock files
    - path: ".*_mock\\.go"
      linters:
        - govet
        - errcheck

    # Exclude complexity check for main function
    - text: "cyclomatic complexity"
      source: "func main\\("

  max-issues-per-linter: 0
  max-same-issues: 0

severity:
  default-severity: error
  case-sensitive: false
  rules:
    - linters:
        - dupl
        - mnd
        - goconst
      severity: warning

    - linters:
        - gosec
        - errcheck
        - govet
      severity: error
